<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Vipul Goyal | Research Portfolio</title>
  <meta
    name="description"
    content="Research portfolio of Vipul Goyal. Exploring neuroregeneration, stem cells, neuroscience, and cancer biology."
  />
  <meta name="author" content="Vipul Goyal" />
  <meta name="theme-color" content="#071410" />

  <meta property="og:title" content="Vipul Goyal | Research Portfolio" />
  <meta
    property="og:description"
    content="Research interests at the intersection of neuroscience, stem cells, and disease biology."
  />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://vipulgoyal05.github.io/" />

  <meta name="twitter:card" content="summary" />

  <link
    rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23071410'/%3E%3Ctext x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' font-family='Arial' font-size='27' font-weight='bold' fill='%2397f3c5'%3EVG%3C/text%3E%3C/svg%3E"
  />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --bg: #071410;
      --bg-soft: #0b1c16;
      --card: rgba(16, 37, 28, 0.72);
      --card-hover: rgba(22, 48, 36, 0.9);
      --border: rgba(151, 243, 197, 0.13);
      --border-strong: rgba(151, 243, 197, 0.3);
      --text: #e8f3ec;
      --muted: #9aafa3;
      --accent: #97f3c5;
      --accent-soft: #c2f9dc;
      --accent-dark: #163b2a;
      --mono: "DM Mono", monospace;
      --sans: "Manrope", sans-serif;
      --max-width: 1120px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 100px;
    }

    body {
      background:
        radial-gradient(
          circle at 80% 8%,
          rgba(36, 91, 61, 0.17),
          transparent 30%
        ),
        radial-gradient(
          circle at 10% 45%,
          rgba(27, 72, 52, 0.12),
          transparent 28%
        ),
        var(--bg);
      color: var(--text);
      font-family: var(--sans);
      line-height: 1.7;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
    }

    .container {
      width: min(var(--max-width), calc(100% - 48px));
      margin: 0 auto;
    }

    .mono {
      font-family: var(--mono);
    }

    .muted {
      color: var(--muted);
    }

    .accent {
      color: var(--accent);
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--accent);
      font-family: var(--mono);
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      content: "";
      display: inline-block;
      width: 22px;
      height: 1px;
      background: var(--accent);
    }

    .section {
      padding: 100px 0;
      border-top: 1px solid rgba(151, 243, 197, 0.07);
    }

    .section-heading {
      margin-bottom: 42px;
    }

    .section-heading h2 {
      margin-top: 12px;
      font-size: clamp(2rem, 4vw, 3rem);
      line-height: 1.15;
      letter-spacing: -0.055em;
      font-weight: 700;
    }

    .section-heading p {
      max-width: 650px;
      margin-top: 16px;
      color: var(--muted);
      font-size: 1rem;
    }

    /* Navigation */

    .nav-wrap {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(7, 20, 16, 0.84);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid rgba(151, 243, 197, 0.1);
    }

    nav {
      min-height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.95rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      white-space: nowrap;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border: 1px solid var(--border-strong);
      border-radius: 10px;
      color: var(--accent);
      background: rgba(151, 243, 197, 0.06);
      font-family: var(--mono);
      font-size: 0.78rem;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 25px;
      list-style: none;
    }

    .nav-links a {
      color: var(--muted);
      font-size: 0.82rem;
      transition: color 0.2s ease;
    }

    .nav-links a:hover {
      color: var(--accent);
    }

    .nav-contact {
      padding: 9px 15px;
      border: 1px solid var(--border-strong);
      border-radius: 999px;
      color: var(--accent) !important;
    }

    /* Hero */

    .hero {
      min-height: 670px;
      display: flex;
      align-items: center;
      position: relative;
      padding: 100px 0 110px;
      overflow: hidden;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(280px, 0.8fr);
      align-items: center;
      gap: 60px;
    }

    .hero-content {
      position: relative;
      z-index: 2;
    }

    .hero-status {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 13px;
      margin-bottom: 28px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: rgba(151, 243, 197, 0.04);
      color: var(--muted);
      font-family: var(--mono);
      font-size: 0.7rem;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 12px rgba(151, 243, 197, 0.65);
    }

    .hero h1 {
      max-width: 750px;
      font-size: clamp(3.3rem, 8vw, 6.5rem);
      line-height: 0.98;
      letter-spacing: -0.075em;
      font-weight: 800;
    }

    .hero h1 span {
      display: block;
      color: var(--accent);
    }

    .hero-subtitle {
      max-width: 620px;
      margin-top: 28px;
      color: #b7c9bd;
      font-size: clamp(1rem, 2vw, 1.15rem);
      line-height: 1.8;
    }

    .hero-subtitle strong {
      color: var(--text);
      font-weight: 600;
    }

    .currently-working {
      max-width: 620px;
      margin-top: 25px;
      padding: 16px 18px;
      border-left: 2px solid var(--accent);
      background: linear-gradient(
        90deg,
        rgba(151, 243, 197, 0.07),
        transparent
      );
      color: var(--muted);
      font-size: 0.9rem;
    }

    .currently-working strong {
      color: var(--accent);
      font-weight: 600;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 13px;
      margin-top: 32px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 13px 20px;
      border: 1px solid var(--border-strong);
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 700;
      transition:
        transform 0.2s ease,
        background 0.2s ease,
        border-color 0.2s ease;
    }

    .button:hover {
      transform: translateY(-2px);
    }

    .button-primary {
      background: var(--accent);
      color: #071410;
      border-color: var(--accent);
    }

    .button-primary:hover {
      background: var(--accent-soft);
    }

    .button-secondary {
      color: var(--text);
      background: rgba(255, 255, 255, 0.02);
    }

    .button-secondary:hover {
      background: rgba(151, 243, 197, 0.08);
    }

    /* Decorative neural graphic */

    .hero-visual {
      position: relative;
      min-height: 400px;
      display: grid;
      place-items: center;
    }

    .visual-glow {
      position: absolute;
      width: 310px;
      height: 310px;
      border-radius: 50%;
      background: rgba(71, 179, 119, 0.13);
      filter: blur(55px);
    }

    .neural-art {
      position: relative;
      width: 100%;
      max-width: 430px;
      opacity: 0.9;
      animation: float 8s ease-in-out infinite;
    }

    .neural-art .orbit {
      fill: none;
      stroke: rgba(151, 243, 197, 0.18);
      stroke-width: 1;
      stroke-dasharray: 4 8;
    }

    .neural-art .connection {
      fill: none;
      stroke: rgba(151, 243, 197, 0.43);
      stroke-width: 1.4;
    }

    .neural-art .node {
      fill: var(--bg);
      stroke: var(--accent);
      stroke-width: 1.5;
    }

    .neural-art .core {
      fill: rgba(151, 243, 197, 0.13);
      stroke: var(--accent);
      stroke-width: 1.5;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-12px);
      }
    }

    /* About */

    .about-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 60px;
      align-items: start;
    }

    .about-copy p {
      color: var(--muted);
      margin-bottom: 18px;
      font-size: 1rem;
    }

    .about-copy p strong {
      color: var(--text);
      font-weight: 600;
    }

    .focus-card {
      padding: 28px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--card);
    }

    .focus-card h3 {
      margin-bottom: 20px;
      font-size: 1rem;
      font-weight: 700;
    }

    .focus-list {
      display: grid;
      gap: 14px;
      list-style: none;
    }

    .focus-list li {
      display: flex;
      align-items: flex-start;
      gap: 13px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .focus-list li::before {
      content: "↗";
      color: var(--accent);
      font-family: var(--mono);
      flex-shrink: 0;
    }

    /* Research directions */

    .research-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .research-card {
      min-height: 255px;
      padding: 27px;
      border: 1px solid var(--border);
      border-radius: 13px;
      background: var(--card);
      transition:
        transform 0.25s ease,
        background 0.25s ease,
        border-color 0.25s ease;
    }

    .research-card:hover {
      transform: translateY(-5px);
      background: var(--card-hover);
      border-color: var(--border-strong);
    }

    .research-number {
      color: var(--accent);
      font-family: var(--mono);
      font-size: 0.75rem;
    }

    .research-card h3 {
      margin-top: 28px;
      font-size: 1.25rem;
      line-height: 1.35;
      letter-spacing: -0.03em;
    }

    .research-card p {
      margin-top: 13px;
      color: var(--muted);
      font-size: 0.88rem;
    }

    /* Experience */

    .experience-list {
      display: grid;
      gap: 18px;
    }

    .experience-card {
      display: grid;
      grid-template-columns: 190px 1fr;
      gap: 30px;
      padding: 28px;
      border: 1px solid var(--border);
      border-radius: 13px;
      background: var(--card);
    }

    .experience-meta {
      color: var(--muted);
      font-family: var(--mono);
      font-size: 0.72rem;
      line-height: 1.8;
    }

    .experience-content h3 {
      font-size: 1.15rem;
      letter-spacing: -0.025em;
    }

    .experience-place {
      margin-top: 5px;
      color: var(--accent);
      font-size: 0.85rem;
    }

    .experience-content p {
      margin-top: 13px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .experience-content ul {
      margin: 14px 0 0 18px;
      color: var(--muted);
      font-size: 0.88rem;
    }

    .experience-content li {
      margin-top: 7px;
      padding-left: 4px;
    }

    /* Featured project */

    .project-card {
      position: relative;
      overflow: hidden;
      padding: 42px;
      border: 1px solid var(--border-strong);
      border-radius: 18px;
      background:
        radial-gradient(
          circle at 100% 0%,
          rgba(91, 180, 126, 0.13),
          transparent 35%
        ),
        linear-gradient(
          135deg,
          rgba(17, 43, 31, 0.95),
          rgba(8, 25, 18, 0.95)
        );
    }

    .project-topline {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .project-tag {
      padding: 7px 11px;
      border: 1px solid var(--border-strong);
      border-radius: 999px;
      color: var(--accent);
      font-family: var(--mono);
      font-size: 0.68rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .project-card h3 {
      max-width: 780px;
      margin-top: 28px;
      font-size: clamp(1.8rem, 4vw, 3rem);
      line-height: 1.15;
      letter-spacing: -0.055em;
    }

    .project-description {
      max-width: 760px;
      margin-top: 20px;
      color: var(--muted);
      font-size: 0.98rem;
    }

    .project-details {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-top: 35px;
    }

    .project-detail {
      padding: 18px;
      border: 1px solid rgba(151, 243, 197, 0.12);
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.12);
    }

    .project-detail span {
      display: block;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .project-detail strong {
      display: block;
      margin-top: 8px;
      color: var(--text);
      font-size: 0.92rem;
      font-weight: 600;
    }

    .project-note {
      margin-top: 24px;
      color: var(--muted);
      font-size: 0.8rem;
    }

    /* Toolkit */

    .toolkit-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }

    .toolkit-card {
      padding: 27px;
      border: 1px solid var(--border);
      border-radius: 13px;
      background: var(--card);
    }

    .toolkit-card h3 {
      font-size: 1rem;
      font-weight: 700;
    }

    .toolkit-card p {
      margin-top: 9px;
      color: var(--muted);
      font-size: 0.82rem;
    }

    .tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 18px;
      list-style: none;
    }

    .tag-list li {
      padding: 7px 10px;
      border: 1px solid rgba(151, 243, 197, 0.13);
      border-radius: 6px;
      color: #c4d6ca;
      background: rgba(151, 243, 197, 0.04);
      font-family: var(--mono);
      font-size: 0.68rem;
    }

    .training-list {
      display: grid;
      gap: 13px;
      margin-top: 18px;
      list-style: none;
    }

    .training-list li {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      color: var(--muted);
      font-size: 0.85rem;
    }

    .training-list li::before {
      content: "↗";
      color: var(--accent);
      font-family: var(--mono);
    }

    /* Beyond the lab */

    .beyond-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .beyond-card {
      padding: 30px;
      border: 1px solid var(--border);
      border-radius: 13px;
      background: var(--card);
    }

    .beyond-card h3 {
      font-size: 1.1rem;
    }

    .beyond-card p {
      margin-top: 13px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .beyond-label {
      display: block;
      margin-top: 20px;
      color: var(--accent);
      font-family: var(--mono);
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* Contact */

    .contact-panel {
      padding: 48px;
      border: 1px solid var(--border-strong);
      border-radius: 18px;
      background:
        radial-gradient(
          circle at 100% 0%,
          rgba(91, 180, 126, 0.12),
          transparent 40%
        ),
        var(--card);
    }

    .contact-panel h2 {
      margin-top: 15px;
      font-size: clamp(2rem, 5vw, 3.7rem);
      line-height: 1.1;
      letter-spacing: -0.06em;
    }

    .contact-panel p {
      max-width: 600px;
      margin-top: 18px;
      color: var(--muted);
    }

    .contact-links {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 28px;
    }

    .contact-link {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 11px 15px;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.82rem;
      transition:
        background 0.2s ease,
        border-color 0.2s ease;
    }

    .contact-link:hover {
      border-color: var(--border-strong);
      background: rgba(151, 243, 197, 0.06);
    }

    .contact-link span {
      color: var(--accent);
    }

    /* Footer */

    footer {
      padding: 30px 0;
      border-top: 1px solid rgba(151, 243, 197, 0.08);
    }

    .footer-inner {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }

    .footer-copy {
      color: var(--muted);
      font-size: 0.75rem;
    }

    .footer-focus {
      color: #71877a;
      font-family: var(--mono);
      font-size: 0.68rem;
    }

    /* Responsive */

    @media (max-width: 900px) {
      .hero-grid {
        grid-template-columns: 1fr;
        gap: 20px;
      }

      .hero {
        padding-top: 75px;
      }

      .hero-visual {
        min-height: 280px;
      }

      .neural-art {
        max-width: 310px;
      }

      .about-grid {
        grid-template-columns: 1fr;
        gap: 30px;
      }

      .research-grid {
        grid-template-columns: 1fr 1fr;
      }

      .experience-card {
        grid-template-columns: 1fr;
        gap: 12px;
      }
    }

    @media (max-width: 650px) {
      .container {
        width: min(100% - 32px, var(--max-width));
      }

      nav {
        min-height: 68px;
      }

      .brand {
        font-size: 0.85rem;
      }

      .nav-links {
        gap: 14px;
      }

      .nav-links li:nth-child(2),
      .nav-links li:nth-child(3),
      .nav-links li:nth-child(4),
      .nav-links li:nth-child(5) {
        display: none;
      }

      .nav-contact {
        padding: 8px 12px;
      }

      .hero {
        min-height: auto;
        padding: 75px 0 80px;
      }

      .hero h1 {
        font-size: clamp(3rem, 16vw, 5rem);
      }

      .hero-visual {
        min-height: 230px;
      }

      .section {
        padding: 72px 0;
      }

      .research-grid,
      .toolkit-grid,
      .beyond-grid {
        grid-template-columns: 1fr;
      }

      .research-card {
        min-height: auto;
      }

      .project-card {
        padding: 25px;
      }

      .project-details {
        grid-template-columns: 1fr;
      }

      .contact-panel {
        padding: 28px;
      }

      .footer-inner {
        align-items: flex-start;
        flex-direction: column;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <!-- Navigation -->
  <div class="nav-wrap">
    <nav class="container" aria-label="Main navigation">
      <a class="brand" href="#home" aria-label="Vipul Goyal home">
        <span class="brand-mark">VG</span>
        <span>Vipul Goyal</span>
      </a>

      <ul class="nav-links">
        <li><a href="#about">About</a></li>
        <li><a href="#research">Research</a></li>
        <li><a href="#experience">Experience</a></li>
        <li><a href="#project">Project</a></li>
        <li><a href="#toolkit">Toolkit</a></li>
        <li><a class="nav-contact" href="
